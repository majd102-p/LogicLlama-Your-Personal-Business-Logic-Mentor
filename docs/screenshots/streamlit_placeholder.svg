<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f2f6"/>
  
  <!-- Header -->
  <rect width="800" height="60" fill="#0d47a1"/>
  <text x="20" y="40" font-size="24" font-weight="bold" fill="white" font-family="Arial">LogicLlama Dashboard</text>
  
  <!-- Sidebar -->
  <rect width="200" height="540" y="60" fill="#e8eef7"/>
  <text x="20" y="100" font-size="14" font-weight="bold" fill="#0d47a1" font-family="Arial">Navigation</text>
  <text x="20" y="130" font-size="12" fill="#333" font-family="Arial">• Search Logic Bugs</text>
  <text x="20" y="160" font-size="12" fill="#333" font-family="Arial">• View CVEs</text>
  <text x="20" y="190" font-size="12" fill="#333" font-family="Arial">• Browse CWEs</text>
  <text x="20" y="220" font-size="12" fill="#333" font-family="Arial">• OWASP Topics</text>
  <text x="20" y="250" font-size="12" fill="#333" font-family="Arial">• Analytics</text>
  <text x="20" y="280" font-size="12" fill="#333" font-family="Arial">• Settings</text>
  
  <!-- Main content area -->
  <rect x="200" y="60" width="600" height="540" fill="white"/>
  
  <!-- Title in main area -->
  <text x="220" y="100" font-size="20" font-weight="bold" fill="#0d47a1" font-family="Arial">Business Logic Analysis</text>
  
  <!-- Sample cards -->
  <rect x="220" y="120" width="280" height="120" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="240" y="150" font-size="14" font-weight="bold" fill="#333" font-family="Arial">Recent Vulnerabilities</text>
  <text x="240" y="175" font-size="12" fill="#666" font-family="Arial">Total: 1,234</text>
  <text x="240" y="200" font-size="12" fill="#666" font-family="Arial">High Severity: 89</text>
  <text x="240" y="225" font-size="12" fill="#666" font-family="Arial">Last updated: Today</text>
  
  <rect x="540" y="120" width="280" height="120" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="560" y="150" font-size="14" font-weight="bold" fill="#333" font-family="Arial">Coverage Statistics</text>
  <text x="560" y="175" font-size="12" fill="#666" font-family="Arial">CVE Database: 95%</text>
  <text x="560" y="200" font-size="12" fill="#666" font-family="Arial">CWE Catalog: 98%</text>
  <text x="560" y="225" font-size="12" fill="#666" font-family="Arial">OWASP Mapped: 100%</text>
  
  <!-- Footer -->
  <rect y="540" width="800" height="60" fill="#f0f2f6" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="575" font-size="11" fill="#666" font-family="Arial">LogicLlama v0.1.0 | © 2026 LogicLlama Contributors | MIT License</text>
</svg>
